<?xml version='1.0' encoding='UTF-8' ?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
      
<h:head>
  <link rel="stylesheet" href="css/style.css"/>
  <title>Require4Testing</title>
</h:head>

<body>
  <ui:include src="/WEB-INF/includes/navbar.xhtml"/>
   <div class="page">
        <div class="panel-header">
            <h1>Require4Testing</h1>
          </div>
        <p>Get an Overview of the current status and coverage.</p>
  
        <div class="panel">
          <h:outputText value="Number of Requirements: #{requirementController.getAllRequirements().size()}" />
        </div>
        <div class="panel">
          <h:outputText value="Number of Testcases: #{testcaseController.getAllTestcases().size()}" />
        </div>

        <div class="panel-header">
            <h1>Upcoming Tests</h1>
          </div>
        <p> Find out which Test executions are planned. Executions can be planned inside of a Test.</p>
        <div class="panel">
          <p:schedule value="#{scheduleBean.model}" view="timeGridWeek"/>
        </div>
   </div>
</body>
</html>
