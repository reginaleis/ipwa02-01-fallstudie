<?xml version='1.0' encoding='UTF-8' ?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
  <link rel="stylesheet" href="css/style.css"/>
  <title>Edit</title>
</h:head>

<body>
    <f:metadata>
        <f:viewParam name="index" value="#{requirementController.index}" />
    </f:metadata>
    <div class="page">
        <div class="panel-header">
            <h1>Edit Requirement</h1>
        </div>
        
        <div class="panel">
            <h:form>
                <h:panelGrid columns="3" >
                    <h:commandLink value="zurück" action="#{requirementController.previous()}"
                                    rendered="#{requirementController.index > 0}"/>
                    <h:outputText value=""/>
                    <h:outputText rendered="#{requirementController.index == 0}" value=" "/>
                    <h:commandLink value="vor" action="#{requirementController.next()}"/>


                    <h:outputLabel value="ID:" for="id"/>
                    <h:outputText id="id" value="#{requirementController.requirement.id}"/>
                    <h:outputText value=""/>


                    <h:outputLabel value="Content:" for="content"/>
                    <h:inputText id="content" value="#{requirementController.requirement.content}" size="40" required="true"/>
                    <h:message for="content" styleClass="error"/>

                    <h:outputLabel value="Author:" for="author"/>
                    <h:inputText id="author" value="#{requirementController.requirement.author}" size="40" required="true"/>
                    <h:outputText value=""/>

                    <h:outputLabel value="Status:" for="status"/>
                    <h:selectOneMenu value = "#{requirementController.requirement.status}">
                        <f:selectItem itemLabel="Draft" itemValue="Draft" />
                        <f:selectItem itemLabel="In Review" itemValue="In Review" />
                        <f:selectItem itemLabel="Approved" itemValue="Approved" />
                    </h:selectOneMenu>  
                    <h:outputText value=""/> 

                    <h:outputLabel value="Type:" for="type"/>
                    <h:selectOneMenu value = "#{requirementController.requirement.type}">
                        <f:selectItem itemLabel="Functional" itemValue="Functional" />
                        <f:selectItem itemLabel="Non-Functional" itemValue="Non-Functional" />
                    </h:selectOneMenu>  
                    <h:outputText value=""/>
                </h:panelGrid>
                <h:button value="CANCEL" outcome="/requirements.xhtml" />
                <h:commandButton value="SAVE" action="#{requirementController.saveCurrent}" />
            </h:form>
        </div>
    </div>
</body>
</html>
