<?xml version='1.0' encoding='UTF-8' ?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
  <link rel="stylesheet" href="css/style.css"/>
  <title>Tests</title>
</h:head>

<body>
    <ui:include src="/WEB-INF/includes/navbar.xhtml"/>
    <div class="page">
        <div class="panel-header">
            <h1>Testcase Overview</h1>
        </div>
        
        <div class="panel">
            <h:button value="Add new Testcase" outcome="/addTestcase.xhtml" />
            <h:dataTable class="data-table" var="testcase" value="#{testcaseController.getAllTestcases()}" >
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    <h:outputText value="#{testcase.id}" />
                </h:column>
                <h:column>
                    <f:facet name="header">Description</f:facet>
                    <h:outputText value="#{testcase.description}" />
                </h:column>
                <h:column>
                    <f:facet name="header">Tester</f:facet>
                    <h:outputText value="#{testcase.tester}" />
                </h:column>
                <h:column>
                    <f:facet name="header">Teststeps</f:facet>
                    <h:outputText value="#{testcase.testSteps}" />
                </h:column>
                <h:column>
                    <f:facet name="header">expected result</f:facet>
                    <h:outputText value="#{testcase.expectedResult}" />
                </h:column>
                <h:column>
                    <f:facet name="header">tested requirement</f:facet>
                    <h:panelGroup rendered="#{not empty testcase.testedRequirement}">
                        <h:outputText value="#{testcase.testedRequirement.id}: #{testcase.testedRequirement.content}" />
                    </h:panelGroup>
                    <h:panelGroup rendered="#{empty testcase.testedRequirement}">
                        <h:outputText value="--" />
                    </h:panelGroup>
                </h:column>
                <h:column>
                    <f:facet name="header">latest result</f:facet>
                    <h:outputText value="#{testcase.lastTestResult}" />
                </h:column>
                <h:column>
                    <h:button value="Edit" outcome="/editTestcase.xhtml" >
                        <f:param name="index" value="#{testcase.id}" />
                    </h:button>
                </h:column>
            </h:dataTable>
            
        </div>
        
    </div>
</body>
</html>
