<?xml version='1.0' encoding='UTF-8' ?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
  <link rel="stylesheet" href="css/style.css"/>
  <title>Tests</title>
</h:head>

<body>
    <div class="page">
        <div class="panel-header">
            <h1>Testcase Overview</h1>
        </div>
        
        <div class="panel">
            <h:dataTable class="data-table" var="testcase" value="#{testcaseCollection.testcases}" >
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    <h:outputText value="#{testcase.id}" />
                </h:column>
                <h:column>
                    <f:facet name="header">Description</f:facet>
                    <h:outputText value="#{testcase.description}" />
                </h:column>
                <h:column>
                    <f:facet name="header">Tester</f:facet>
                    <h:outputText value="#{testcase.tester}" />
                </h:column>
                <h:column>
                    <f:facet name="header">Teststeps</f:facet>
                    <h:outputText value="#{testcase.testSteps}" />
                </h:column>
                <h:column>
                    <f:facet name="header">expected result</f:facet>
                    <h:outputText value="#{testcase.expectedResult}" />
                </h:column>
                <h:column>
                    <f:facet name="header">tested requirements</f:facet>
                    <h:outputText value="#{testcase.testedRequirements}" />
                </h:column>
            </h:dataTable>
            
        </div>
        
    </div>
</body>
</html>
