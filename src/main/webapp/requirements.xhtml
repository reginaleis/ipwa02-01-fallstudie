<?xml version='1.0' encoding='UTF-8' ?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
  <link rel="stylesheet" href="css/style.css"/>
  <title>Requirements</title>
</h:head>

<body>
    <ui:include src="/WEB-INF/includes/navbar.xhtml"/>
    <div class="page">
        <div class="panel-header">
            <h1>Requirements</h1>
        </div>
        <p>All Requirements are listed here. Add a new one or edit an existing.</p>
        <div class="panel">

            <h:button value="Add new Requirement" outcome="/addRequirement.xhtml" />
            <h:dataTable class="data-table" var="requirement" value="#{requirementController.getAllRequirements()}" >
                    <h:column>
                        <f:facet name="header">ID</f:facet>
                        <h:outputText value="#{requirement.id}" />
                    </h:column>
                    <h:column>
                        <f:facet name="header">Content</f:facet>
                        <h:outputText value="#{requirement.content}" />
                    </h:column>
                    <h:column>
                        <f:facet name="header">Author</f:facet>
                        <h:outputText value="#{requirement.author}" />
                    </h:column>
                    <h:column>
                        <f:facet name="header">Status</f:facet>
                        <h:outputText value="#{requirement.status}" />
                    </h:column>
                    <h:column>
                        <f:facet name="header">Type</f:facet>
                        <h:outputText value="#{requirement.type}" />
                    </h:column> 
                    <h:column>
                        <f:facet name="header">Linked Testcases
                            (Set in Testcase)
                        </f:facet>
                        <ui:fragment rendered="#{empty requirement.linkedTestcases}">
                            <h:outputText value="--" />
                        </ui:fragment>
                        <ui:repeat value="#{requirement.linkedTestcasesSorted}" var="testcase">
                            <h:outputText value="#{testcase.id}: #{testcase.description}"/>
                            <br/>
                        </ui:repeat>
                    </h:column> 
                    <h:column>
                        <h:button value="Edit" outcome="/editRequirement.xhtml" >
                            <f:param name="index" value="#{requirement.id}" />
                        </h:button>
                    </h:column>
            </h:dataTable>
        </div>
    </div>
</body>
</html>
