<?xml version='1.0' encoding='UTF-8' ?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
  <link rel="stylesheet" href="css/style.css"/>
  <title>Requirements</title>
</h:head>

<body>
    <div class="page">
        <div class="panel-header">
            <h1>Requirements Overview</h1>
        </div>
    
        <div class="panel">
            
            <h:dataTable class="data-table" var="requirement" value="#{requirementCollection.requirements}" >
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    <h:outputText value="#{requirement.id}" />
                </h:column>
                <h:column>
                    <f:facet name="header">Content</f:facet>
                    <p:inplace id="content">
                        <f:facet name="output">
                            Content
                            <h:outputText value="#{requirement.content}" />
                        </f:facet>
                        <f:facet name="input">
                            <h:inputText  id="content" value="#{requirement.content}" size="40"/>
                        </f:facet>
                    </p:inplace>
                </h:column>
                <h:column>
                <f:facet name="header">Author</f:facet>
                <p:inplace label="#{requirement.author}">
                    <h:inputText  id="author" value="#{requirement.author}" size="40"/>
                </p:inplace>
            </h:column>
            <h:column>
                <f:facet name="header">Status</f:facet>
                <h:outputText value="#{requirement.status}" />
                <h:selectOneMenu>
                    <f:selectItem itemLabel="Draft" itemValue="Draft" />
                    <f:selectItem itemLabel="In Review" itemValue="In Review" />
                </h:selectOneMenu>      
            </h:column>
            <h:column>
                <f:facet name="header">Type</f:facet>
                <h:outputText value="#{requirement.type}" />
            </h:column>
            <h:column>
                <f:facet name="header">Actions</f:facet>
                <h:commandLink action="{requirementCollection.requirements.remove(requirement)}" onclick="alert('Hello World!');">
                    <img style="padding-left: 20px" src="images/pencil-line.svg"/>
                </h:commandLink>
                <h:commandLink action="{requirementCollection.requirements.remove(requirement)}" >
                    <img style="padding-left: 20px" src="images/trash.svg"/>
                </h:commandLink>
            </h:column>
        </h:dataTable>

    </div>


</div>
</body>
</html>
