<?xml version='1.0' encoding='UTF-8' ?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
  <link rel="stylesheet" href="css/style.css"/>
  <title>Requirements</title>
</h:head>

<body>
    <ui:include src="/WEB-INF/includes/navbar.xhtml"/>
    <div class="page">
        <div class="panel-header">
            <h1>Requirements Overview</h1>
        </div>
    
        <div class="panel">
            <h:commandLink onclick="alert('This button is still in the making!');" >
                <img src="images/square-plus.svg"/>
            </h:commandLink>
            <h:dataTable class="data-table" var="requirement" value="#{requirementCollection.requirements}" >
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    <h:outputText value="#{requirement.id}" />
                </h:column>
                <h:column>
                    <f:facet name="header">Content</f:facet>
                    <p:inplace label="#{requirement.content}">
                        <h:inputText  id="content" value="#{requirement.content}" size="20"/>
                    </p:inplace>
                </h:column>
                <h:column>
                    <f:facet name="header">Author</f:facet>
                    <p:inplace label="#{requirement.author}">
                        <h:inputText  id="author" value="#{requirement.author}" size="20"/>
                    </p:inplace>
                </h:column>
                <h:column>
                    <f:facet name="header">Status</f:facet>
                    <h:selectOneMenu>
                        <f:selectItem itemLabel="Draft" itemValue="Draft" />
                        <f:selectItem itemLabel="In Review" itemValue="In Review" />
                        <f:selectItem itemLabel="Approved" itemValue="Approved" />
                    </h:selectOneMenu>      
                </h:column>
                <h:column>
                    <f:facet name="header">Type</f:facet>
                    <h:selectOneMenu>
                        <f:selectItem itemLabel="Functional" itemValue="Functional" />
                        <f:selectItem itemLabel="Non-Functional" itemValue="Non-Functional" />
                    </h:selectOneMenu>  
                </h:column>    
                <h:column>
                    <f:facet name="header">Linked Testcases</f:facet>
                    <h:outputText value="#{requirement.linkedTestcases}" />
                </h:column>           

                <h:column>
                    <f:facet name="header">Actions</f:facet>
                    <h:commandLink onclick="alert('This button is still in the making!');">
                        <img src="images/pencil-line.svg"/>
                    </h:commandLink>
                    <h:commandLink action="{requirementCollection.requirements.remove(requirement)}" >
                        <img src="images/trash.svg"/>
                    </h:commandLink>
                </h:column>
            </h:dataTable>
        </div>
    </div>
</body>
</html>
