<?xml version='1.0' encoding='UTF-8' ?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
  <link rel="stylesheet" href="css/style.css"/>
  <title>Edit</title>
</h:head>

<body>
    <f:metadata>
        <f:viewParam name="index" value="#{testcaseController.index}" />
    </f:metadata>
    <div class="page">
        <div class="panel-header">
            <h1>Edit Testcase</h1>
        </div>
        
        <div class="panel">
            <h:form>
                <h:panelGrid columns="3" >
                    <h:commandLink value="zurück" action="#{testcaseController.previous()}"
                                    rendered="#{testcaseController.index > 0}"/>
                    <h:outputText value=""/>
                    <h:outputText rendered="#{testcaseController.index == 0}" value=" "/>
                    <h:commandLink value="vor" action="#{testcaseController.next()}"/>


                    <h:outputLabel value="ID:" for="id"/>
                    <h:outputText id="id" value="#{testcaseController.testcase.id}"/>
                    <h:outputText value=""/>

                    <h:outputLabel value="Description:" for="description"/>
                    <h:inputText id="description" value="#{testcaseController.testcase.description}" size="40" required="true"/>
                    <h:message for="description" styleClass="error"/>

                    <h:outputLabel value="Tester:" for="tester"/>
                    <h:inputText id="tester" value="#{testcaseController.testcase.tester}" size="40" required="true"/>
                    <h:outputText value=""/>

                    <h:outputLabel value="Test Steps:" for="testSteps"/>
                    <h:inputText id="testSteps" value="#{testcaseController.testcase.testSteps}" size="40" required="true"/>
                    <h:outputText value=""/>

                    <h:outputLabel value="Expected Result:" for="expectedResult"/>
                    <h:inputText id="expectedResult" value="#{testcaseController.testcase.expectedResult}" size="40" required="true"/>
                    <h:outputText value=""/>

                    <h:outputLabel value="Tested Requirement:" for="testedRequirement"/>
                    <h:selectOneMenu id="testedRequirement" value="#{testcaseController.testcase.testedRequirement}" converter="requirementConverter">
                        <f:selectItem itemLabel="-- none --" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{requirementController.allRequirements}" var="requirement" itemLabel="#{requirement.id}" itemValue="#{requirement}" />
                    </h:selectOneMenu>  
                    <h:message for="testedRequirement" styleClass="error"/> 

                    <h:outputLabel value="Last Test Result:" for="lastTestResult"/>
                    <h:selectOneMenu value = "#{testcaseController.testcase.lastTestResult}">
                        <f:selectItem itemLabel="Passed" itemValue="Passed" />
                        <f:selectItem itemLabel="Failed" itemValue="Failed" />
                        <f:selectItem itemLabel="Skipped" itemValue="Skipped" />
                        <f:selectItem itemLabel="Broken" itemValue="Broken" />
                    </h:selectOneMenu>  
                    <h:outputText value=""/>
                </h:panelGrid>
                <h:button value="CANCEL" outcome="/testcases.xhtml" />
                <h:commandButton value="SAVE" action="#{testcaseController.saveCurrent}" />
            </h:form>
        </div>
    </div>
</body>
</html>
